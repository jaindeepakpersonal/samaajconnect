# samaajconnect — local development stack.
#
# Shared infrastructure first, then one block per service (CLAUDE.md §8).
# Every service block follows the same shape: its own logical database via
# ConnectionStrings__Default, the shared Kafka/Redis endpoints, and
# depends_on: postgres, kafka.

name: samaajconnect

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

x-service-environment: &service-environment
  ASPNETCORE_ENVIRONMENT: Development
  Kafka__BootstrapServers: kafka:9092
  Redis__ConnectionString: redis:6379

services:
  postgres:
    image: postgres:16-alpine
    container_name: samaajconnect-postgres
    environment:
      POSTGRES_USER: samaajconnect
      POSTGRES_PASSWORD: samaajconnect
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samaajconnect -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: samaajconnect-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Single-node KRaft broker — no ZooKeeper. Two listeners: `kafka:9092` for
  # containers on this network, `localhost:29092` for tooling on the host.
  kafka:
    image: apache/kafka:3.8.0
    container_name: samaajconnect-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: samaajconnect-local-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  identity-tenant-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/identity-tenant-service/Dockerfile
    container_name: samaajconnect-identity
    environment:
      <<: *service-environment
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=samaajconnect_identity;Username=samaajconnect;Password=samaajconnect"
      # Local default only. Every non-local environment must inject this from a
      # secret store - the service refuses to boot without a 32+ character key.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-development-signing-key-do-not-use-in-production}"
      # Creates the first Super Admin on an empty database, then never touches
      # it again. Leave the identifier empty to skip bootstrapping entirely.
      Bootstrap__SuperAdminIdentifier: "${SUPERADMIN_IDENTIFIER:-superadmin@samaajconnect.local}"
      Bootstrap__SuperAdminPassword: "${SUPERADMIN_PASSWORD:-change-me-immediately}"
      Outbox__PollIntervalSeconds: "5"
      Outbox__BatchSize: "50"
    ports:
      - "5101:8080"

  audit-notification-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/audit-notification-service/Dockerfile
    container_name: samaajconnect-audit
    environment:
      <<: *service-environment
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=samaajconnect_audit_notification;Username=samaajconnect;Password=samaajconnect"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-development-signing-key-do-not-use-in-production}"
      Outbox__PollIntervalSeconds: "5"
      Consumer__GroupId: "audit-notification-service"
    ports:
      - "5102:8080"

  member-family-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/member-family-service/Dockerfile
    container_name: samaajconnect-members
    environment:
      <<: *service-environment
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=samaajconnect_member_family;Username=samaajconnect;Password=samaajconnect"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-development-signing-key-do-not-use-in-production}"
      Outbox__PollIntervalSeconds: "5"
      Consumer__GroupId: "member-family-service"
    ports:
      - "5103:8080"

  timeline-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/timeline-service/Dockerfile
    container_name: samaajconnect-timeline
    environment:
      <<: *service-environment
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=samaajconnect_timeline;Username=samaajconnect;Password=samaajconnect"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-development-signing-key-do-not-use-in-production}"
      Outbox__PollIntervalSeconds: "5"
    ports:
      - "5104:8080"
  volunteer-groups-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/volunteer-groups-service/Dockerfile
    container_name: samaajconnect-groups
    environment:
      <<: *service-environment
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=samaajconnect_volunteer_groups;Username=samaajconnect;Password=samaajconnect"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-development-signing-key-do-not-use-in-production}"
      Outbox__PollIntervalSeconds: "5"
    ports:
      - "5105:8080"
  events-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/events-service/Dockerfile
    container_name: samaajconnect-events
    environment:
      <<: *service-environment
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=samaajconnect_events;Username=samaajconnect;Password=samaajconnect"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-development-signing-key-do-not-use-in-production}"
      Outbox__PollIntervalSeconds: "5"
    ports:
      - "5106:8080"
  social-issues-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/social-issues-service/Dockerfile
    container_name: samaajconnect-issues
    environment:
      <<: *service-environment
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=samaajconnect_social_issues;Username=samaajconnect;Password=samaajconnect"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-development-signing-key-do-not-use-in-production}"
      Outbox__PollIntervalSeconds: "5"
    ports:
      - "5107:8080"
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: samaajconnect-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      identity-tenant-service:
        condition: service_started
      audit-notification-service:
        condition: service_started
      member-family-service:
        condition: service_started
      timeline-service:
        condition: service_started
      volunteer-groups-service:
        condition: service_started
      events-service:
        condition: service_started
      social-issues-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Redis__ConnectionString: redis:6379
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-local-development-signing-key-do-not-use-in-production}"
      Gateway__IdentityServiceUrl: "http://identity-tenant-service:8080"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
