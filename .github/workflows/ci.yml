name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: the older run's result is
# about code nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (${{ matrix.name }})
    runs-on: ubuntu-latest

    # One job per solution so a failure names the service that broke, and so
    # they run in parallel. The integration suites need Docker for
    # Testcontainers, which ubuntu-latest provides.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-tenant-service
            solution: services/identity-tenant-service/Sangam.IdentityTenant.sln
          - name: audit-notification-service
            solution: services/audit-notification-service/Sangam.AuditNotification.sln
          - name: member-family-service
            solution: services/member-family-service/Sangam.MemberFamily.sln
          - name: timeline-service
            solution: services/timeline-service/Sangam.Timeline.sln
          - name: volunteer-groups-service
            solution: services/volunteer-groups-service/Sangam.VolunteerGroups.sln
          - name: events-service
            solution: services/events-service/Sangam.Events.sln
          - name: social-issues-service
            solution: services/social-issues-service/Sangam.SocialIssues.sln
          - name: celebrity-voting-service
            solution: services/celebrity-voting-service/Sangam.CelebrityVoting.sln
          - name: pathshala-service
            solution: services/pathshala-service/Sangam.Pathshala.sln
          - name: boli-service
            solution: services/boli-service/Sangam.Boli.sln
          - name: gateway
            solution: gateway/Sangam.Gateway.sln

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      # Warnings are errors (Directory.Build.props), so a build that succeeds
      # here is genuinely clean rather than merely compiling.
      - name: Build
        run: dotnet build ${{ matrix.solution }} --no-restore -c Release

      - name: Test
        run: dotnet test ${{ matrix.solution }} --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Shared library tests
        run: npm run test:libs

      - name: Member portal tests
        run: npm run test:app

      - name: Admin portal tests
        run: npm run test:admin

      # Production configuration, so budget violations and the
      # environment.production.ts replacement are both exercised. Both apps,
      # because a build break in one does not show up in the other.
      - name: Build member portal
        run: npm run build

      - name: Build admin portal
        run: npm run build:admin

  conventions:
    name: Cross-service conventions
    runs-on: ubuntu-latest

    # Rules the repository states in prose and no compiler enforces. All ten
    # of these read source rather than running anything, so they are seconds.
    steps:
      - uses: actions/checkout@v4

      # The mechanical half of SECURITY-CHECKLIST.md. It used to be a walk with
      # a date on it, which is worth exactly as much as the date - the pass
      # before the last one covered three services of ten. The two allow-lists
      # it compares against are read out of the checklist, so this fails
      # whichever side moves.
      - name: Security invariants match SECURITY-CHECKLIST.md
        run: bash scripts/security-invariants.sh

      # Every list of the ten services is written by hand somewhere - this
      # matrix, the migrations job below, the gateway's routes, the smoke
      # script's sections. Being missing from one does not fail; it is simply
      # absent. boli-service was absent from three of them at once, so its 49
      # tests - the ones holding "a Boli has exactly one highest bid" included -
      # ran nowhere but a laptop. Each mapping is read from the file that owns
      # it, so a new service fails until it is in all of them.
      - name: No service is left out of CI or the gateway
        run: bash scripts/service-coverage.sh

      # ModuleCatalog, libs/shared's ModuleKeys and the gateway's route metadata
      # are three lists of the same five keys, in three languages. Both code
      # comments already said "adding a module means adding it in three places"
      # and nothing held them to it. A portal key the catalogue lacks does not
      # fail - the filter never matches and the feature is invisible to every
      # Samaaj, which is what happened to two Home tiles.
      - name: Module keys agree in all three places
        run: bash scripts/module-keys.sh

      # Root CLAUDE.md §4.4 calls the pipeline order "fixed, load-bearing" and
      # it is duplicated across ten copies of one file. The expected order is
      # read out of CLAUDE.md, so this fails whichever side moves.
      - name: Pipeline behavior order matches CLAUDE.md §4.4
        run: bash scripts/pipeline-order.sh

      # Reported, never failed: a listed endpoint is not automatically a bug -
      # `GET /v1/identity/tenants/by-id/{id}` is the gateway's and belongs to no
      # app. This is here so the list is in front of somebody on every change
      # rather than only when a person remembers to run it, which is how six
      # cycles of gaps went unnoticed.
      - name: Endpoints no app can reach
        run: bash scripts/unreachable-endpoints.sh

      # The mirror of the sweep above, and reported the same way. Tenant.LogoUrl
      # was a response field with a wireframe control and no command behind it
      # for the platform's whole life - a field the API could read and nothing
      # could write. One legitimate case exists (a value written by raw SQL), so
      # this reports rather than fails.
      - name: Domain fields nothing can write
        run: bash scripts/unwritable-fields.sh

      # Root CLAUDE.md §4.3 asks for one validator per request, and
      # ValidationBehavior runs the ones that exist - so a request with none has
      # no input validation at all. DecideChildConversionCommand carried a
      # free-text note with nothing checking it, and a note longer than the
      # column answered 500 rather than 400. Reported, not failed: two requests
      # resolve their own strings and never store them.
      - name: Free text with no validator
        run: bash scripts/validator-coverage.sh

      # A service's own CLAUDE.md is the doc §10 sends a developer to, and its
      # Commands and Queries sections are a claimed complete list. §9's lesson
      # about hand-written lists applies one level down: eleven requests across
      # four services were in no line of their own documentation when this was
      # written, member-family-service's entire photo feature among them - built,
      # tested and smoke-checked, with a long prose section explaining it, and
      # absent from the tables above that prose. This one fails rather than
      # reports: there is no second reading of a command nobody wrote down.
      - name: Every command and query is in its service's CLAUDE.md
        run: bash scripts/service-docs.sh

      # The half the endpoint sweep structurally cannot see. That one finds
      # callers by /v1/ literals in app code, and every endpoint's literal lives
      # in the app's API client - so an endpoint whose client method nothing
      # calls still counts as reached. It found two: setGrievanceContact, a
      # DPDP s.13 obligation DPDP-COMPLIANCE.md marked "built" with curl as its
      # only interface, and issueActivationCode, which the Invite screen has
      # always said was available from a screen that did not call it. Reported,
      # not failed: a method could be reached by a name grep cannot follow.
      - name: API-client methods no screen calls
        run: bash scripts/uncalled-api-methods.sh

      # KnownEvents.Describe's fallback for an undescribed topic is
      # EntityIdProperty: null, explicitly - not a best-effort guess. Five
      # cycles running found the same gap behind that line: a domain event
      # whose own doc comment promised the audit trail would answer "who did
      # this?", silently unkept because an audit row is written either way and
      # nothing fails. Every one of the platform's 50 topics has a considered
      # descriptor as of 2026-09-05; this fails the day a new one ships
      # without joining them, rather than being found by rereading
      # KnownEvents.cs against ten services' Domain folders by hand.
      - name: Every domain event has an audit descriptor
        run: bash scripts/audit-descriptor-coverage.sh

  migrations:
    name: EF migrations are up to date
    runs-on: ubuntu-latest

    # A model changed without a matching migration is invisible until a
    # deployment fails against a real database. This catches it at review time.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Check identity-tenant-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/identity-tenant-service/src/Sangam.IdentityTenant.Infrastructure \
            --startup-project services/identity-tenant-service/src/Sangam.IdentityTenant.Api

      - name: Check audit-notification-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/audit-notification-service/src/Sangam.AuditNotification.Infrastructure \
            --startup-project services/audit-notification-service/src/Sangam.AuditNotification.Api

      - name: Check member-family-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/member-family-service/src/Sangam.MemberFamily.Infrastructure \
            --startup-project services/member-family-service/src/Sangam.MemberFamily.Api

      - name: Check timeline-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/timeline-service/src/Sangam.Timeline.Infrastructure \
            --startup-project services/timeline-service/src/Sangam.Timeline.Api

      - name: Check volunteer-groups-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/volunteer-groups-service/src/Sangam.VolunteerGroups.Infrastructure \
            --startup-project services/volunteer-groups-service/src/Sangam.VolunteerGroups.Api

      - name: Check events-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/events-service/src/Sangam.Events.Infrastructure \
            --startup-project services/events-service/src/Sangam.Events.Api

      - name: Check social-issues-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/social-issues-service/src/Sangam.SocialIssues.Infrastructure \
            --startup-project services/social-issues-service/src/Sangam.SocialIssues.Api

      - name: Check celebrity-voting-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/celebrity-voting-service/src/Sangam.CelebrityVoting.Infrastructure \
            --startup-project services/celebrity-voting-service/src/Sangam.CelebrityVoting.Api

      - name: Check pathshala-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/pathshala-service/src/Sangam.Pathshala.Infrastructure \
            --startup-project services/pathshala-service/src/Sangam.Pathshala.Api

      - name: Check boli-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/boli-service/src/Sangam.Boli.Infrastructure \
            --startup-project services/boli-service/src/Sangam.Boli.Api

  smoke:
    name: Through the gateway
    runs-on: ubuntu-latest
    needs: [backend]

    # The coverage CLAUDE.md section 9 asks for: a route that works when curled
    # directly at a service but was never wired into YARP passes every unit and
    # integration test above, and fails here.
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait

      # Before the smoke script, not after: its last section deliberately
      # exhausts the credential rate limit with four hundred sign-in attempts,
      # and anything signing in during the following minute gets a 429. The two
      # own separate Samaaj, so neither disturbs the other's data.
      - name: Cross-tenant isolation
        run: bash scripts/tenant-isolation-probe.sh

      - name: Smoke test
        run: bash scripts/smoke-through-gateway.sh

      # Last, so the databases have real data in them: a drill against ten empty
      # schemas proves the plumbing and nothing else. It expects some databases
      # to be moving by now — the audit log consumes every event this job has
      # just generated — and reports those as uncomparable rather than failing,
      # which is the state a real deployment is always in.
      - name: Backup and restore drill
        run: bash scripts/backup-restore-drill.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
