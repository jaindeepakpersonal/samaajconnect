name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: the older run's result is
# about code nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (${{ matrix.name }})
    runs-on: ubuntu-latest

    # One job per solution so a failure names the service that broke, and so
    # they run in parallel. The integration suites need Docker for
    # Testcontainers, which ubuntu-latest provides.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-tenant-service
            solution: services/identity-tenant-service/Sangam.IdentityTenant.sln
          - name: audit-notification-service
            solution: services/audit-notification-service/Sangam.AuditNotification.sln
          - name: member-family-service
            solution: services/member-family-service/Sangam.MemberFamily.sln
          - name: timeline-service
            solution: services/timeline-service/Sangam.Timeline.sln
          - name: volunteer-groups-service
            solution: services/volunteer-groups-service/Sangam.VolunteerGroups.sln
          - name: events-service
            solution: services/events-service/Sangam.Events.sln
          - name: social-issues-service
            solution: services/social-issues-service/Sangam.SocialIssues.sln
          - name: celebrity-voting-service
            solution: services/celebrity-voting-service/Sangam.CelebrityVoting.sln
          - name: pathshala-service
            solution: services/pathshala-service/Sangam.Pathshala.sln
          - name: gateway
            solution: gateway/Sangam.Gateway.sln

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      # Warnings are errors (Directory.Build.props), so a build that succeeds
      # here is genuinely clean rather than merely compiling.
      - name: Build
        run: dotnet build ${{ matrix.solution }} --no-restore -c Release

      - name: Test
        run: dotnet test ${{ matrix.solution }} --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Shared library tests
        run: npm run test:libs

      - name: Member portal tests
        run: npm run test:app

      - name: Admin portal tests
        run: npm run test:admin

      # Production configuration, so budget violations and the
      # environment.production.ts replacement are both exercised. Both apps,
      # because a build break in one does not show up in the other.
      - name: Build member portal
        run: npm run build

      - name: Build admin portal
        run: npm run build:admin

  conventions:
    name: Cross-service conventions
    runs-on: ubuntu-latest

    # Rules the repository states in prose and no compiler enforces. Both of
    # these read source rather than running anything, so they are seconds.
    steps:
      - uses: actions/checkout@v4

      # Root CLAUDE.md §4.4 calls the pipeline order "fixed, load-bearing" and
      # it is duplicated across ten copies of one file. The expected order is
      # read out of CLAUDE.md, so this fails whichever side moves.
      - name: Pipeline behavior order matches CLAUDE.md §4.4
        run: bash scripts/pipeline-order.sh

      # Reported, never failed: a listed endpoint is not automatically a bug -
      # `GET /v1/identity/tenants/by-id/{id}` is the gateway's and belongs to no
      # app. This is here so the list is in front of somebody on every change
      # rather than only when a person remembers to run it, which is how six
      # cycles of gaps went unnoticed.
      - name: Endpoints no app can reach
        run: bash scripts/unreachable-endpoints.sh

  migrations:
    name: EF migrations are up to date
    runs-on: ubuntu-latest

    # A model changed without a matching migration is invisible until a
    # deployment fails against a real database. This catches it at review time.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Check identity-tenant-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/identity-tenant-service/src/Sangam.IdentityTenant.Infrastructure \
            --startup-project services/identity-tenant-service/src/Sangam.IdentityTenant.Api

      - name: Check audit-notification-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/audit-notification-service/src/Sangam.AuditNotification.Infrastructure \
            --startup-project services/audit-notification-service/src/Sangam.AuditNotification.Api

      - name: Check member-family-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/member-family-service/src/Sangam.MemberFamily.Infrastructure \
            --startup-project services/member-family-service/src/Sangam.MemberFamily.Api

      - name: Check timeline-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/timeline-service/src/Sangam.Timeline.Infrastructure \
            --startup-project services/timeline-service/src/Sangam.Timeline.Api

      - name: Check volunteer-groups-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/volunteer-groups-service/src/Sangam.VolunteerGroups.Infrastructure \
            --startup-project services/volunteer-groups-service/src/Sangam.VolunteerGroups.Api

      - name: Check events-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/events-service/src/Sangam.Events.Infrastructure \
            --startup-project services/events-service/src/Sangam.Events.Api

      - name: Check social-issues-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/social-issues-service/src/Sangam.SocialIssues.Infrastructure \
            --startup-project services/social-issues-service/src/Sangam.SocialIssues.Api

      - name: Check celebrity-voting-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/celebrity-voting-service/src/Sangam.CelebrityVoting.Infrastructure \
            --startup-project services/celebrity-voting-service/src/Sangam.CelebrityVoting.Api

      - name: Check pathshala-service
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project services/pathshala-service/src/Sangam.Pathshala.Infrastructure \
            --startup-project services/pathshala-service/src/Sangam.Pathshala.Api

  smoke:
    name: Through the gateway
    runs-on: ubuntu-latest
    needs: [backend]

    # The coverage CLAUDE.md section 9 asks for: a route that works when curled
    # directly at a service but was never wired into YARP passes every unit and
    # integration test above, and fails here.
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Smoke test
        run: bash scripts/smoke-through-gateway.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
