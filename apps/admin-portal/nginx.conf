# The admin panel is a static single-page app plus a proxy to the gateway.
#
# It gets its own origin rather than sharing the member portal's, and that is
# deliberate. Both apps use the same `TokenStore`, whose sessionStorage keys are
# `samaajconnect.token` and `samaajconnect.refresh`. sessionStorage is scoped to
# an origin, so on one origin an admin signing in would overwrite a member's
# token in the same tab, and the panel would then call every endpoint with a
# member's token and 403 on all of them. Two origins, two sessions.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The gateway, on the compose network. Named here rather than baked into
    # the app because the app's production ApiConfig says `gatewayUrl: ''` -
    # same origin - so something serving the app has to be what reaches the API.
    location /v1/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An admin waiting on a Samaaj list should not be cut off at nginx's
        # default minute while the gateway is still answering.
        proxy_read_timeout 120s;
    }

    # Hashed build output. Safe to cache hard: a new build produces new names.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the SPA. Angular owns the routing, so an unknown path
    # is index.html and the router decides - without this, a reload on
    # /tenants/new is a 404 from nginx rather than a screen.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html itself must never be cached, or a deploy leaves browsers
        # asking for chunk names that no longer exist.
        add_header Cache-Control "no-store";
    }
}
