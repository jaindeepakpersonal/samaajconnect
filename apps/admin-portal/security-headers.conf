# Security headers for every response the admin panel's nginx sends.
#
# Included in each location rather than set once on the server, because nginx
# drops every inherited add_header the moment a location sets one of its own -
# and two of the locations below set Cache-Control. `always` so an error page
# carries them too.
#
# The content policy allows this origin only: the app loads nothing from
# anywhere else, calls /v1 on its own origin (proxied below), and shows images
# it fetched itself (blob:) or was handed inline (data: - the sign-in CAPTCHA).
# Styles need 'unsafe-inline' because Angular injects component styles as
# <style> tags; scripts do not, and are held to 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
